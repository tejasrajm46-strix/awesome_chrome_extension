<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Glass New Tab — bookmark pages and boards for your new tab</title>
  <desc id="d">On the left, the project name and promise: bookmarks as a real library, with pages, boards and a panel that scrolls. On the right, a specimen of the bookmark panel: an Add Bookmark button, a search field with an Exact toggle, three bookmark cards with favicons, a scrollbar, and the line "23 bookmarks · All pages".</desc>

  <defs>
    <radialGradient id="glow" cx="0.08" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#822319" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#822319" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#822319" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0B0A0C"/>
  <rect width="1200" height="420" rx="26" fill="url(#glow)"/>
  <rect x="640" y="40" width="1" height="340" fill="#221E24"/>

  <g id="title-block">
    <g transform="translate(64 88) scale(0.211)">
