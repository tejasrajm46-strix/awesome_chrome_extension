    </g>
    <text x="134" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2.4" fill="#A29AA2">CHROME · EDGE · MANIFEST V3 · NO ACCOUNT</text>

    <text x="64" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="72" font-weight="700" fill="#F6F3F3">Glass New Tab</text>

    <text x="64" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="23" fill="#C9C3C6">Bookmarks as a real library — pages, boards,</text>
    <text x="64" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="23" fill="#C9C3C6">and a panel that scrolls instead of growing.</text>

    <text x="64" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.4" fill="#9A9296">NO BUILD STEP · 0 DEPENDENCIES · NO SIGN-IN</text>
  </g>

