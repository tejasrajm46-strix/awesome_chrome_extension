<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">How a library is built: pages, boards, bookmarks, stored locally</title>
  <desc id="d">A diagram of the data model. A page named Work, Home and Reading list sits on the left; an arrow leads to a board column holding Clients with 12 bookmarks, Admin with 4 and Ideas with 7; a second arrow leads to individual bookmark rows. A rail underneath shows pages, boards and bookmarks live in localStorage and video wallpapers in IndexedDB, with no server and no account.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#5A535E"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="26" fill="#0B0A0C"/>
  <text x="64" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2.4" fill="#E4665F">HOW IT WORKS</text>
  <text x="64" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="32" font-weight="600" fill="#F6F3F3">One page, many boards, many bookmarks</text>

  <g id="col-pages">
    <text x="64" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.6" fill="#A29AA2">PAGE</text>
    <rect x="64" y="176" width="320" height="152" rx="16" fill="#151318" stroke="#2B262C"/>
    <rect x="86" y="198" width="110" height="32" rx="10" fill="#1E1B21" stroke="#2B262C"/>
    <text x="141" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Work</text>
    <rect x="86" y="238" width="110" height="32" rx="10" fill="#1E1B21" stroke="#2B262C"/>
    <text x="141" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Home</text>
    <rect x="86" y="278" width="186" height="32" rx="10" fill="#1E1B21" stroke="#2B262C"/>
    <text x="179" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Reading list</text>
  </g>

  <path d="M392 252h44" stroke="#5A535E" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="col-boards">
    <text x="456" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.6" fill="#A29AA2">BOARD</text>
    <rect x="456" y="176" width="320" height="152" rx="16" fill="#151318" stroke="#2B262C"/>
    <rect x="478" y="198" width="160" height="32" rx="10" fill="#1E1B21" stroke="#2B262C"/>
    <text x="502" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Clients</text>
    <text x="618" y="220" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B838B">12</text>
    <rect x="478" y="238" width="160" height="32" rx="10" fill="#1E1B21" stroke="#2B262C"/>
    <text x="502" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Admin</text>
    <text x="618" y="260" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B838B">4</text>
    <rect x="478" y="278" width="160" height="32" rx="10" fill="#1E1B21" stroke="#2B262C"/>
    <text x="502" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Ideas</text>
    <text x="618" y="300" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B838B">7</text>
  </g>

  <path d="M784 252h44" stroke="#5A535E" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="col-bookmarks">
    <text x="848" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.6" fill="#A29AA2">BOOKMARK</text>
    <rect x="848" y="176" width="288" height="152" rx="16" fill="#151318" stroke="#2B262C"/>
    <g>
      <rect x="868" y="196" width="248" height="38" rx="11" fill="#1B181E" stroke="#2A252C"/>
      <circle cx="890" cy="215" r="10" fill="#262229"/><circle cx="890" cy="215" r="4" fill="#E0483C"/>
      <text x="910" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">LeetCode</text>
    </g>
    <g>
      <rect x="868" y="240" width="248" height="38" rx="11" fill="#1B181E" stroke="#2A252C"/>
      <circle cx="890" cy="259" r="10" fill="#262229"/><circle cx="890" cy="259" r="4" fill="#4B7EF7"/>
      <text x="910" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">HackerRank</text>
    </g>
    <g>
      <rect x="868" y="284" width="248" height="38" rx="11" fill="#1B181E" stroke="#2A252C"/>
      <circle cx="890" cy="303" r="10" fill="#262229"/><circle cx="890" cy="303" r="4" fill="#35B37E"/>
      <text x="910" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" fill="#F0ECEE">Arena AI</text>
    </g>
  </g>

  <rect x="64" y="360" width="1072" height="56" rx="16" fill="#151318" stroke="#2B262C"/>
  <text x="88" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A29AA2">localStorage — your library</text>
  <rect x="392" y="376" width="1" height="24" fill="#2B262C"/>
  <text x="416" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A29AA2">IndexedDB — wallpapers</text>
  <rect x="696" y="376" width="1" height="24" fill="#2B262C"/>
  <text x="720" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A29AA2">Chrome profile</text>
  <g transform="translate(936 380)">
    <circle cx="9" cy="9" r="9" fill="none" stroke="#E4665F" stroke-width="2"/>
    <path d="M3 3l12 12" stroke="#E4665F" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="962" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E4665F">no server · no account</text>
</svg>
